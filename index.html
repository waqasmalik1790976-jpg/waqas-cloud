<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Slip Maker</title>
<style>
:root{--navy:#1c2b6b;--blue:#3a4fb5;--gold:#c9a227;--mute:#5b6694;--bg:#eaedf6;--foot:#f4f5fb;--line:#dfe2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans","Segoe UI",Arial,sans-serif;color:var(--navy);padding:16px 12px 40px;background-color:#eaedf6}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}
[contenteditable]{outline:0;border-radius:4px;cursor:text}
[contenteditable]:hover{background:rgba(201,162,39,.18)}
[contenteditable]:focus{background:rgba(201,162,39,.28);box-shadow:0 0 0 2px var(--gold)}
.in{color:inherit}
.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
.form input{font:inherit;font-size:16px;padding:10px;border:1px solid #c9cfe4;border-radius:8px;color:var(--navy);background:#fff;width:100%}
.form input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.wide{grid-column:1/-1}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pri{background:var(--navy);color:#ffe08a}
.sec{background:#fff;color:var(--navy);border:1px solid #c9cfe4}
#msg{color:var(--mute);font-weight:600}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);border-top:6px solid var(--gold)}
.head{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;padding:26px 18px;gap:12px}
.head h2{margin:0;font-size:clamp(20px,4vw,28px)}
.head small{display:block;font-size:13px;opacity:.8;text-align:right}
.head b{font-size:clamp(18px,3.5vw,24px)}
.acc{padding:16px 18px 20px}.acc small{color:var(--mute);font-size:13px}
.acc h3{margin:4px 0 10px;font-size:clamp(18px,3.5vw,24px)}
.acc .no{color:var(--mute);font-weight:700;font-size:clamp(15px,3vw,22px);word-break:break-all}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{background:var(--blue);color:#fff;padding:14px 8px;font-size:15px;border-left:1px solid #2f43a0}
td{text-align:center;padding:18px 8px;font-weight:700;font-size:16px}
th:last-child,td:last-child{text-align:right;padding-right:16px}
.sum{background:var(--foot);padding:22px 18px 28px;display:flex;justify-content:flex-end}
.sum dl{margin:0;width:min(100%,460px)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600;font-size:17px}
.row span:last-child{color:var(--mute);font-weight:700}
.total{margin-top:18px;background:var(--navy);color:#ffe08a;border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:clamp(18px,3.5vw,24px)}
.slip{margin-bottom:26px}
.acts{margin:0 0 14px}
.msg{color:var(--mute);font-weight:600}
.one [data-a="del"]{display:none}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 18px}
table.t3{min-width:420px}
.kvs{padding:8px 18px 22px;background:#fff}.kvs small{color:var(--mute);font-size:13px}
.kv{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.kv span{width:120px;flex:none;color:var(--mute);font-weight:600;font-size:15px}
.kv b{flex:1;font-size:clamp(15px,3vw,19px);word-break:break-all}
.head .per{font-size:clamp(15px,3vw,20px)}
th .hb{display:flex;gap:6px;justify-content:center;margin-top:6px}
th:last-child .hb{justify-content:flex-end}
th .hb button{padding:0;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}
th .hb button:hover{background:rgba(255,255,255,.35)}
th span[contenteditable]{display:inline-block;min-width:40px;padding:0 4px}
.pc{background:var(--bg);color:var(--ptx);border-radius:18px;overflow:hidden;border:1px solid var(--bd);animation:rise .7s ease both;box-shadow:0 14px 34px var(--sh)}
.pc::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--b1),var(--b2),var(--b3),var(--b1));background-size:200% 100%;animation:flow 3s linear infinite}
.ph{background:linear-gradient(135deg,var(--h1),var(--h2));background-size:220% 220%;animation:flow 8s ease infinite;color:#fff;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.ph .chip{display:block;color:var(--chip);font-size:12px;font-weight:700;letter-spacing:.14em;margin-bottom:4px}
.ph h2{margin:0;font-size:clamp(19px,4vw,27px)}
.pill{background:linear-gradient(135deg,var(--pa),var(--pb));color:var(--pt);border-radius:12px;padding:8px 14px;text-align:center;flex:none;max-width:48%;animation:glow 2.2s ease-out infinite}
.pill small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.pill b{font-size:clamp(13px,3vw,18px)}
.tiles{display:flex;align-items:center;gap:8px;padding:22px 18px}
.tiles i{font-style:normal;font-size:22px;color:var(--op);font-weight:700;animation:bob 1.8s ease-in-out infinite}
.tiles i:nth-of-type(2){animation-delay:.5s}
.tile{flex:1;min-width:0;border-radius:14px;padding:12px 8px;text-align:center;border:1px solid var(--t1d);background:var(--t1b);color:var(--t1t);transition:transform .2s,box-shadow .2s;animation:pop .5s ease backwards}
.tile small{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tile b{display:block;font-size:clamp(16px,4vw,26px);margin-top:4px;word-break:break-all}
.tile.o{background:var(--t2b);border-color:var(--t2d);color:var(--t2t)}
.tile.hi{background:linear-gradient(135deg,var(--t3a),var(--t3b));border-color:var(--t3d);color:var(--t3t)}
.tiles>:nth-child(1){animation-delay:.2s}.tiles>:nth-child(3){animation-delay:.35s}.tiles>:nth-child(5){animation-delay:.5s}
.tile:hover{transform:translateY(-6px) scale(1.05);box-shadow:0 12px 24px var(--sh)}
.ded{display:flex;justify-content:space-between;gap:10px;padding:0 22px;color:var(--mu);font-weight:600;font-size:17px;animation:slide .6s .6s ease backwards}
.ded .neg{color:var(--ng);font-weight:700}
.hero{position:relative;overflow:hidden;margin:16px 18px;background:linear-gradient(135deg,var(--ha),var(--hb));background-size:200% 200%;color:var(--ht);border-radius:16px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:clamp(16px,3.5vw,20px);animation:pop .6s .7s ease backwards,flow 5s ease infinite}
.hero b{font-size:clamp(24px,6vw,36px);color:var(--hm)}
.hero::after{content:"";position:absolute;top:0;left:0;width:25%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:sheen 3.2s ease-in-out infinite}
.pa{margin:0 18px 22px;background:var(--pbg);border-left:6px solid var(--pbar);border-radius:14px;padding:16px 18px;color:var(--ptx);transition:transform .25s,box-shadow .25s;animation:pop .6s .9s ease backwards}
.pa:hover{transform:translateY(-5px);box-shadow:0 14px 28px var(--sh)}
.pa .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pa .top small{color:var(--psm);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.pa .top b{font-size:clamp(14px,3vw,17px)}
.pa .lb{display:block;margin-top:14px;font-size:11px;color:var(--plb);letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.pa .no{font-size:clamp(16px,4.2vw,26px);font-weight:700;letter-spacing:.04em;word-break:break-all}
.pa .tt{font-size:clamp(15px,3.5vw,19px);font-weight:700}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes flow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes sheen{0%{transform:translateX(-130%) skewX(-20deg)}60%,100%{transform:translateX(480%) skewX(-20deg)}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 var(--gl)}50%{box-shadow:0 0 0 10px transparent}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.pc,.pc *,.pc::before,.hero::after{animation:none!important;transition:none!important}}
.rcw{max-width:480px;margin:10px auto 18px;filter:drop-shadow(0 10px 18px var(--sh));animation:print 1.2s ease-out both}
.rc{position:relative;background:var(--bg);color:var(--ptx);font-family:"Courier New",Courier,monospace;padding:28px 24px 22px}
.rc::before,.rc::after{content:"";position:absolute;left:0;right:0;height:10px;background:linear-gradient(135deg,var(--bg) 5px,transparent 0) 0 0/10px 10px,linear-gradient(-135deg,var(--bg) 5px,transparent 0) 0 0/10px 10px}
.rc::before{top:-10px;transform:scaleY(-1)}.rc::after{bottom:-10px}
.rc>*{animation:slide .5s ease backwards}
.rc>*:nth-child(1){animation-delay:0.39s}.rc>*:nth-child(2){animation-delay:0.48s}.rc>*:nth-child(3){animation-delay:0.57s}.rc>*:nth-child(4){animation-delay:0.66s}.rc>*:nth-child(5){animation-delay:0.75s}.rc>*:nth-child(6){animation-delay:0.84s}.rc>*:nth-child(7){animation-delay:0.93s}.rc>*:nth-child(8){animation-delay:1.02s}.rc>*:nth-child(9){animation-delay:1.11s}.rc>*:nth-child(10){animation-delay:1.20s}.rc>*:nth-child(11){animation-delay:1.29s}.rc>*:nth-child(12){animation-delay:1.38s}.rc>*:nth-child(13){animation-delay:1.47s}
.rc-top{text-align:center}.rc-top small{display:block;letter-spacing:.35em;font-weight:700;color:var(--psm);font-size:13px}
.rc-top h2{margin:6px 0 4px;font-size:clamp(17px,4.4vw,22px)}.rc-p{font-size:15px;color:var(--mu);font-weight:700}
.rc-dash{border-top:2px dashed var(--plb);margin:14px 0;opacity:.7}
.rc-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:6px 0;font-size:clamp(14px,3.6vw,18px)}
.rc-row>span{color:var(--mu);font-weight:700}.rc-row b{text-align:right;word-break:break-all}
.rc-bold{font-weight:700;border-top:1px solid var(--plb);margin-top:4px;padding-top:10px}
.rc-neg{color:var(--ng)}
.rc-total{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;letter-spacing:.08em;font-size:15px}
.rc-total b{font-size:clamp(30px,8vw,44px);letter-spacing:0;color:var(--ptx)}
.rc-acc small{display:block;text-align:center;letter-spacing:.2em;font-size:12px;color:var(--psm);font-weight:700;margin-bottom:4px}
.rc-stamp{display:block;margin:16px auto 0;width:max-content;border:3px solid var(--t3a);color:var(--t3a);font-weight:700;letter-spacing:.25em;padding:4px 14px;border-radius:6px;font-size:20px;transform:rotate(-8deg);animation:stamp .5s 1.5s cubic-bezier(.2,2,.4,1) backwards}
.sp{display:flex;border-radius:18px;overflow:hidden;background:var(--bg);border:1px solid var(--bd);box-shadow:0 14px 34px var(--sh);animation:rise .7s ease both}
.sp-l{position:relative;overflow:hidden;width:37%;min-width:250px;background:linear-gradient(160deg,var(--h1),var(--h2));background-size:200% 200%;animation:flow 9s ease infinite;color:#fff;padding:24px 22px;display:flex;flex-direction:column;gap:14px}
.sp-l::before,.sp-l::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.13);animation:float 7s ease-in-out infinite}
.sp-l::before{width:190px;height:190px;right:-70px;top:-60px}.sp-l::after{width:150px;height:150px;left:-50px;bottom:-50px;animation-delay:2s}
.sp-l>*{position:relative;z-index:1}
.sp-l .chip{color:var(--chip);font-size:12px;font-weight:700;letter-spacing:.14em}
.sp-l h2{margin:0;font-size:clamp(20px,4vw,26px);line-height:1.25}
.sp-per{background:linear-gradient(135deg,var(--pa),var(--pb));color:var(--pt);border-radius:12px;padding:8px 14px;align-self:flex-start;animation:glow 2.2s ease-out infinite}
.sp-per small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}.sp-per b{font-size:clamp(13px,3vw,17px)}
.sp-big{margin-top:auto;padding-top:10px}.sp-big small{display:block;color:var(--chip);font-size:12px;font-weight:700;letter-spacing:.14em}
.sp-big b{display:block;font-size:clamp(40px,8vw,58px);line-height:1.1;text-shadow:0 3px 14px rgba(0,0,0,.3)}
.sp-r{flex:1;min-width:0;padding:16px 22px 22px;display:flex;flex-direction:column;gap:2px}
.sp-it{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:14px 6px;border-bottom:1px solid var(--bd);animation:slide .5s ease backwards}
.sp-it:nth-child(2){animation-delay:.15s}.sp-it:nth-child(3){animation-delay:.3s}.sp-it:nth-child(4){animation-delay:.45s}
.sp-it>span{color:var(--mu);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.sp-it b{font-size:clamp(18px,4vw,26px);color:var(--ptx)}
.sp-it.hi{background:linear-gradient(135deg,var(--t3a),var(--t3b));border:0;border-radius:12px;padding:14px;margin:4px 0}
.sp-it.hi span,.sp-it.hi b{color:var(--t3t)}.sp-it .neg{color:var(--ng)}
.sp-r .pa{margin:14px 0 0;animation-delay:.7s}
@media(max-width:640px){.sp{flex-direction:column}.sp-l{width:auto}}
@keyframes print{from{clip-path:inset(-30px -30px 100% -30px)}to{clip-path:inset(-30px -30px -30px -30px)}}
@keyframes stamp{from{opacity:0;transform:rotate(-8deg) scale(3)}to{opacity:1;transform:rotate(-8deg) scale(1)}}
@keyframes float{50%{transform:translate(14px,-18px) scale(1.08)}}
@media (prefers-reduced-motion:reduce){.rcw,.rc>*,.rc-stamp,.sp,.sp *,.sp-l::before,.sp-l::after{animation:none!important;transition:none!important}}
.rf{border-radius:clamp(26px,5.5vw,48px);overflow:hidden;background:linear-gradient(135deg,#dff1ee,#cfe2f3);color:#14224f;font-family:"Segoe UI","Noto Sans",Arial,sans-serif;box-shadow:0 14px 34px rgba(30,60,110,.2);animation:rise .7s ease both}
