<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#fff;color:#1f2430;padding:36px 20px 30px;display:flex;flex-direction:column;align-items:center}
.logo-wrap{position:relative;display:flex;flex-direction:column;align-items:center;margin:10px 0 40px}
.logo{width:230px;height:auto;display:block;position:relative;z-index:1;transform-origin:50% 90%;
animation:pop 1s cubic-bezier(.2,1.4,.4,1) both,float 4s ease-in-out 1s infinite}
.shadow{width:130px;height:16px;border-radius:50%;margin-top:6px;background:radial-gradient(ellipse,rgba(255,79,31,.35),transparent 70%);animation:sh 4s ease-in-out 1s infinite}
@keyframes pop{0%{opacity:0;transform:scale(.3) rotate(-14deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-16px) rotate(2deg)}}
@keyframes sh{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(.7);opacity:.5}}
@media(prefers-reduced-motion:reduce){.logo,.shadow{animation:none}}
.grid{display:grid;gap:10px;width:100%;max-width:640px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;text-decoration:none;color:#1f2430;background:#fff;border:1.5px solid #f0e4df;box-shadow:0 4px 12px -6px rgba(255,79,31,.25);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:#ff4f1f;box-shadow:0 14px 28px -10px rgba(255,79,31,.45)}
.tx{flex:1;font-size:.92rem;font-weight:600}
.go{width:24px;height:24px;border-radius:50%;background:#fff1ec;color:#ff4f1f;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;transition:.2s}
