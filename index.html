<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Payment Slip Maker</title>
<style>
:root{--navy:#1c2b6b;--blue:#3a4fb5;--gold:#c9a227;--mute:#5b6694;--bg:#eaedf6;--foot:#f4f5fb;--line:#dfe2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Noto Sans","Segoe UI",Arial,sans-serif;color:var(--navy);padding:16px 12px 40px;background-color:#eaedf6}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;margin:4px 0 14px}
.hint{color:var(--mute);font-size:14px;margin:0 0 12px}
[contenteditable]{outline:0;border-radius:4px;cursor:text}
[contenteditable]:hover{background:rgba(201,162,39,.18)}
[contenteditable]:focus{background:rgba(201,162,39,.28);box-shadow:0 0 0 2px var(--gold)}
.in{color:inherit}
.form{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
.form input{font:inherit;font-size:16px;padding:10px;border:1px solid #c9cfe4;border-radius:8px;color:var(--navy);background:#fff;width:100%}
.form input:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.wide{grid-column:1/-1}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;align-items:center}
button{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:13px 22px;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pri{background:var(--navy);color:#ffe08a}
.sec{background:#fff;color:var(--navy);border:1px solid #c9cfe4}
#msg{color:var(--mute);font-weight:600}
.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid var(--line);border-top:6px solid var(--gold)}
.head{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:flex-end;padding:26px 18px;gap:12px}
.head h2{margin:0;font-size:clamp(20px,4vw,28px)}
.head small{display:block;font-size:13px;opacity:.8;text-align:right}
.head b{font-size:clamp(18px,3.5vw,24px)}
.acc{padding:16px 18px 20px}.acc small{color:var(--mute);font-size:13px}
.acc h3{margin:4px 0 10px;font-size:clamp(18px,3.5vw,24px)}
.acc .no{color:var(--mute);font-weight:700;font-size:clamp(15px,3vw,22px);word-break:break-all}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:560px}
th{background:var(--blue);color:#fff;padding:14px 8px;font-size:15px;border-left:1px solid #2f43a0}
td{text-align:center;padding:18px 8px;font-weight:700;font-size:16px}
th:last-child,td:last-child{text-align:right;padding-right:16px}
.sum{background:var(--foot);padding:22px 18px 28px;display:flex;justify-content:flex-end}
.sum dl{margin:0;width:min(100%,460px)}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);color:var(--mute);font-weight:600;font-size:17px}
.row span:last-child{color:var(--mute);font-weight:700}
.total{margin-top:18px;background:var(--navy);color:#ffe08a;border-radius:12px;padding:20px 22px;display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:clamp(18px,3.5vw,24px)}
.slip{margin-bottom:26px}
.acts{margin:0 0 14px}
.msg{color:var(--mute);font-weight:600}
.one [data-a="del"]{display:none}
th .hb{display:flex;gap:6px;justify-content:center;margin-top:6px}
th:last-child .hb{justify-content:flex-end}
th .hb button{padding:0;width:26px;height:26px;border-radius:50%;font-size:16px;line-height:1;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.55)}
th .hb button:hover{background:rgba(255,255,255,.35)}
th span[contenteditable]{display:inline-block;min-width:40px;padding:0 4px}
</style>
</head>
<body>
<div class="wrap">
<p class="hint">Slip par kisi bhi cheez par click karke seedha edit karein.</p>
<div id="list"></div>
</div>
<template id="tpl">
<section class="slip">
<div class="acts">
  <button class="pri" type="button" data-a="copy">Copy slip</button>
  <button class="sec" type="button" data-a="dup">Duplicate</button>
  <button class="sec" type="button" data-a="del">Delete</button>
  <span class="msg" role="status" aria-live="polite"></span>
</div>
<div class="card">
  <div class="head"><h2 data-k="bank" contenteditable="true"></h2><div><small>Date</small><b data-k="date" contenteditable="true"></b></div></div>
  <div class="acc"><small>Account Details</small><h3 data-k="title" contenteditable="true"></h3><div class="no" data-k="acc" contenteditable="true"></div></div>
  <div class="scroll"><table><thead><tr></tr></thead><tbody><tr></tr></tbody></table></div>
  <div class="sum"><dl>
    <div class="row"><span>Amount</span><span data-o="amt2"></span></div>
    <div class="row"><span>Previous Balance <span data-k="pdate" contenteditable="true"></span></span><span data-k="prev" contenteditable="true"></span></div>
    <div class="row"><span>Advance Payment</span><span data-k="adv" contenteditable="true"></span></div>
    <div class="total"><span>Total Payable Balance</span><span data-o="total"></span></div>
  </dl></div>
</div>
</section>
</template>
<script>
(function(){
  var KEYS=['bank','date','title','acc','pdate','prev','adv'],NUMK={prev:1,adv:1};
  var STORE='slip-app-v4',list=document.getElementById('list'),tpl=document.getElementById('tpl');
  var BASE={veh:['Vehicle',130],prod:['Product',130],gp:['GP',70],nw:['N/W (M)',120],pw:['P/W (M)',120],rate:['Rate',90],amt:['Amount',160],x:['Column',110]};
  var DEF={bank:'Meezan Bank Bhalwal',date:'5-Oct-26',title:'Attah Muhammad',acc:'PK06 MEZN 0098 4501 1284 2517',pdate:'4-10-2026',prev:'1,946,479',adv:'800,000',
    cols:[{t:'veh',v:'AJK-1377'},{t:'prod',v:'Gutka'},{t:'gp',v:'5'},{t:'nw',v:'287.875'},{t:'pw',v:'266.125'},{t:'rate',v:'610'},{t:'amt'}]};
  function num(s){return parseFloat(String(s).replace(/,/g,''))||0}
  function fmt(n){return Math.round(n).toLocaleString('en-US')}
  function fld(n,k){return n.querySelector('[data-k="'+k+'"]')}
  function cname(c){return c.t==='x'?(c.n||''):BASE[c.t][0]}
  function cval(cols,t){for(var i=0;i<cols.length;i++){if(cols[i].t===t)return cols[i].v||''}return ''}
  function get(n){var d={};KEYS.forEach(function(k){d[k]=fld(n,k).textContent.trim()});d.cols=n._cols.map(function(c){return{t:c.t,n:c.n,v:c.v}});return d}
  function calc(d){var amt=Math.round(num(cval(d.cols,'pw'))*num(cval(d.cols,'rate')));return{amt:amt,total:amt+num(d.prev)-num(d.adv)}}
  function norm(d){
    var o={};KEYS.forEach(function(k){o[k]=d[k]!=null?d[k]:DEF[k]});
    if(d.cols){o.cols=d.cols}else{o.cols=DEF.cols.map(function(c){return c.t==='amt'?{t:'amt'}:{t:c.t,v:d[c.t]!=null?d[c.t]:c.v}})}
    return o;
  }
  function save(){try{localStorage.setItem(STORE,JSON.stringify([].map.call(list.children,get)))}catch(e){}}
  function render(n){
    var c=calc(get(n));
    [].forEach.call(n.querySelectorAll('[data-o="amt"]'),function(e){e.textContent=fmt(c.amt)});
    n.querySelector('[data-o="amt2"]').textContent=fmt(c.amt);
    n.querySelector('[data-o="total"]').textContent=fmt(c.total);
    list.classList.toggle('one',list.children.length<2);
    save();
  }
  function say(n,t){var m=n.querySelector('.msg');m.textContent=t;clearTimeout(m.t);m.t=setTimeout(function(){m.textContent=''},3500)}
  function slipText(d){var c=calc(d);
    var rows=[d.bank,'Date: '+d.date,'','Account Title: '+d.title,'Account: '+d.acc,''];
    d.cols.forEach(function(k){rows.push(cname(k)+': '+(k.t==='amt'?fmt(c.amt):(k.v||'')))});
    rows.push('','Previous Balance '+d.pdate+': '+fmt(num(d.prev)),'Advance Payment: '+fmt(num(d.adv)),'Total Payable Balance: '+fmt(c.total));
    return rows.join('\n');}
  function legacy(t){try{var a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();var ok=document.execCommand('copy');document.body.removeChild(a);return ok}catch(e){return false}}
  function copyText(d){var t=slipText(d);
    try{if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(t).then(function(){return true},function(){return legacy(t)})}}catch(e){}
    return Promise.resolve(legacy(t));}
  var F='"Noto Sans","Segoe UI",Arial,sans-serif';
  function slipCanvas(d){
    var cl=calc(d),S=2,W=820,H=588,P=28,c=document.createElement('canvas');c.width=(W+2*P)*S;c.height=(H+2*P)*S;
    var x=c.getContext('2d');x.scale(S,S);
    x.fillStyle='#eaedf6';x.fillRect(0,0,W+2*P,H+2*P);x.translate(P,P);
    x.beginPath();if(x.roundRect){x.roundRect(0,0,W,H,14)}else{x.rect(0,0,W,H)}x.clip();
    var NAVY='#1c2b6b',BLUE='#3a4fb5',GOLD='#c9a227',MUTE='#5b6694',FOOT='#f4f5fb',LINE='#dfe2ee';
    function R(col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w,h)}
    function T(s,a,b,sz,col,al,wt,mw){x.font=(wt||'700')+' '+sz+'px '+F;x.fillStyle=col;x.textAlign=al||'left';if(mw)x.fillText(s,a,b,mw);else x.fillText(s,a,b)}
    R('#ffffff',0,0,W,H);R(GOLD,0,0,W,6);R(NAVY,0,6,W,100);
    T(d.bank,18,66,28,'#fff','left','700',560);
    x.globalAlpha=.8;T('Date',802,44,13,'#fff','right','400');x.globalAlpha=1;
    T(d.date,802,78,24,'#fff','right');
    T('Account Details',18,130,13,MUTE,'left','400');
    T(d.title,18,162,24,NAVY,'left','700',780);
    T(d.acc,18,194,22,MUTE,'left','700',780);
    R(BLUE,0,206,W,50);
    var tot=0;d.cols.forEach(function(k){tot+=BASE[k.t][1]});
    var p=0;
    d.cols.forEach(function(k,i){
      var w=BASE[k.t][1]*W/tot,last=i===d.cols.length-1,cx=last?p+w-16:p+w/2,al=last?'right':'center';
      if(i>0)R('#2f43a0',p,206,1,50);
      T(cname(k),cx,238,15,'#fff',al,'700',w-12);
      T(k.t==='amt'?fmt(cl.amt):(k.v||''),cx,292,16,NAVY,al,'700',w-12);
      p+=w;
    });
    R(LINE,0,316,W,1);R(FOOT,0,317,W,H-317);
    var rows=[['Amount',fmt(cl.amt),MUTE],['Previous Balance '+d.pdate,fmt(num(d.prev)),MUTE],['Advance Payment',fmt(num(d.adv)),MUTE]];
    rows.forEach(function(r,i){var top=340+i*46;T(r[0],346,top+30,17,MUTE,'left','600',300);T(r[1],798,top+30,17,r[2],'right');R(LINE,342,top+46,460,1)});
    x.fillStyle=NAVY;x.beginPath();if(x.roundRect){x.roundRect(342,496,460,64,12)}else{x.rect(342,496,460,64)}x.fill();
    T('Total Payable Balance',364,536,24,'#ffe08a');T(fmt(cl.total),780,536,24,'#ffe08a','right');
    return c;
  }
  function enter(e){if(e.key==='Enter'){e.preventDefault();e.target.blur()}}
  function drawTable(n){
    var tr=n.querySelector('thead tr'),br=n.querySelector('tbody tr');tr.innerHTML='';br.innerHTML='';
    n.querySelector('table').style.minWidth=Math.max(560,n._cols.length*90)+'px';
    n._cols.forEach(function(c,i){
      var th=document.createElement('th'),nm=document.createElement('span');nm.textContent=cname(c);
      if(c.t==='x'){nm.contentEditable='true';nm.addEventListener('input',function(){c.n=nm.textContent.trim();render(n)});nm.addEventListener('keydown',enter)}
      th.appendChild(nm);
      tr.appendChild(th);
      var td=document.createElement('td');
      if(c.t==='amt'){td.setAttribute('data-o','amt')}
      else{td.contentEditable='true';td.textContent=c.v||'';td.addEventListener('input',function(){c.v=td.textContent.trim();render(n)});td.addEventListener('keydown',enter)}
      br.appendChild(td);
    });
  }
  function build(d0,after){
    var d=norm(d0),n=tpl.content.firstElementChild.cloneNode(true);
    n._cols=d.cols.filter(function(c){return c.t!=='x'}).map(function(c){return{t:c.t,n:c.n,v:c.v}});
    KEYS.forEach(function(k){
      var el=fld(n,k);el.textContent=d[k];
      el.addEventListener('input',function(){render(n)});
      el.addEventListener('keydown',enter);
      el.addEventListener('paste',function(e){e.preventDefault();var t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s+/g,' ');document.execCommand('insertText',false,t)});
      if(NUMK[k])el.addEventListener('blur',function(){el.textContent=fmt(num(el.textContent));render(n)});
    });
    drawTable(n);
    n.querySelector('.acts').addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;var a=b.dataset.a;
      if(a==='copy'){
        b.disabled=true;var d0=get(n);
        var done=function(m){b.disabled=false;say(n,m)};
        var toText=function(){copyText(d0).then(function(ok){done(ok?'Slip text copy ho gayi':'Copy nahi hui, screenshot le lein')})};
        try{
          if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write){return toText()}
          var p=new Promise(function(r){slipCanvas(d0).toBlob(r,'image/png')});
          navigator.clipboard.write([new ClipboardItem({'image/png':p})]).then(function(){done('Slip image copy ho gayi, ab paste karein')},toText);
        }catch(err){toText()}
      }else if(a==='dup'){
        var m=build(get(n),n);say(m,'Duplicate slip ban gayi');m.scrollIntoView({behavior:'smooth',block:'center'});
      }else if(a==='next'){
        var d1=get(n),c=calc(d1);
        fld(n,'prev').textContent=fmt(c.total);fld(n,'pdate').textContent=d1.date;fld(n,'adv').textContent='0';
        n._cols.forEach(function(k){if(k.t==='veh'||k.t==='gp'||k.t==='nw'||k.t==='pw'||k.t==='x')k.v=''});
        drawTable(n);render(n);say(n,'Total ab Previous Balance ban gaya. Nayi date aur weights likhein.');fld(n,'date').focus();
      }else if(a==='del'){
        if(list.children.length>1){var nx=n.nextElementSibling||n.previousElementSibling;n.remove();render(nx)}
      }
    });
    if(after)after.after(n);else list.appendChild(n);
    render(n);
    return n;
  }
  var saved=null;try{saved=JSON.parse(localStorage.getItem(STORE)||'null')}catch(e){}
  if(!saved||!saved.length){try{saved=JSON.parse(localStorage.getItem('slip-app-v3')||'null')}catch(e){}}
  if(saved&&saved.length){saved.forEach(function(d){build(d)})}else{build(DEF)}
})();
</script>
</body>
</html>
